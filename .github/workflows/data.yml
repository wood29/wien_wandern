name: Kartendaten aktualisieren
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/data.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-data.mjs
      - name: Commit
        run: |
          git config user.name "wien-wandern-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Kartendaten aktualisiert" && git push)
